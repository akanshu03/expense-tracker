<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#0f172a">Expense Tracker - delivery pipeline and AWS architecture (ap-south-1)</text>

  <!-- Pipeline -->
  <rect x="20" y="50" width="1060" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="32" y="70" font-weight="bold" fill="#334155">GitHub Actions</text>
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="40" y="85" width="120" height="55" rx="6"/><rect x="190" y="85" width="140" height="55" rx="6"/>
    <rect x="360" y="85" width="150" height="55" rx="6"/><rect x="540" y="85" width="130" height="55" rx="6"/>
    <rect x="700" y="85" width="130" height="55" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="860" y="85" width="200" height="55" rx="6"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="100" y="108">PR / merge</text><text x="100" y="126">to main</text>
    <text x="260" y="108">Lint + unit tests</text><text x="260" y="126">pip-audit, tf validate</text>
    <text x="435" y="108">Docker multi-stage</text><text x="435" y="126">build + Trivy scan</text>
    <text x="605" y="108">Push to ECR</text><text x="605" y="126">(SHA tag)</text>
    <text x="765" y="108">Staging deploy</text><text x="765" y="126">+ smoke test</text>
    <text x="960" y="108">Manual approval</text><text x="960" y="126">then Prod blue/green</text>
  </g>
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="112" x2="188" y2="112"/><line x1="330" y1="112" x2="358" y2="112"/>
    <line x1="510" y1="112" x2="538" y2="112"/><line x1="670" y1="112" x2="698" y2="112"/>
    <line x1="830" y1="112" x2="858" y2="112"/>
  </g>

  <!-- AWS -->
  <rect x="20" y="190" width="1060" height="430" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="32" y="210" font-weight="bold" fill="#9a3412">AWS account - VPC 10.20.0.0/16 (2 Availability Zones)</text>

  <text x="60" y="262" fill="#334155">Users</text>
  <rect x="40" y="270" width="80" height="40" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="80" y="295" text-anchor="middle">Browser</text>

  <rect x="160" y="230" width="150" height="130" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="235" y="252" text-anchor="middle" font-weight="bold">Public subnets</text>
  <rect x="175" y="265" width="120" height="40" rx="5" fill="#bae6fd" stroke="#0284c7"/><text x="235" y="290" text-anchor="middle">ALB :80/443 | :8443</text>
  <rect x="175" y="312" width="120" height="35" rx="5" fill="#bae6fd" stroke="#0284c7"/><text x="235" y="334" text-anchor="middle">NAT gateways</text>

  <rect x="350" y="230" width="330" height="190" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="515" y="252" text-anchor="middle" font-weight="bold">Private subnets - ECS Fargate</text>
  <rect x="370" y="270" width="140" height="60" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="440" y="294" text-anchor="middle">BLUE task set</text><text x="440" y="312" text-anchor="middle">current version</text>
  <rect x="525" y="270" width="140" height="60" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="5 3"/>
  <text x="595" y="294" text-anchor="middle">GREEN task set</text><text x="595" y="312" text-anchor="middle">new version</text>
  <rect x="370" y="345" width="295" height="55" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="517" y="368" text-anchor="middle">CodeDeploy: canary 10% / 5 min</text><text x="517" y="386" text-anchor="middle">auto-rollback on failure or alarm</text>

  <rect x="720" y="230" width="170" height="110" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="805" y="252" text-anchor="middle" font-weight="bold">Data subnets (no internet)</text>
  <rect x="740" y="268" width="130" height="55" rx="5" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="805" y="292" text-anchor="middle">RDS PostgreSQL</text><text x="805" y="309" text-anchor="middle">Multi-AZ, encrypted</text>

  <rect x="720" y="370" width="170" height="50" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="805" y="392" text-anchor="middle">Secrets Manager</text><text x="805" y="408" text-anchor="middle">DB credentials</text>
  <rect x="720" y="435" width="170" height="50" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="805" y="457" text-anchor="middle">ECR</text><text x="805" y="473" text-anchor="middle">immutable SHA tags</text>

  <rect x="350" y="450" width="330" height="140" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="515" y="472" text-anchor="middle" font-weight="bold">Monitoring and alerting</text>
  <text x="515" y="500" text-anchor="middle">CloudWatch dashboard: latency p50/p95/p99,</text>
  <text x="515" y="518" text-anchor="middle">5xx errors, request rate, CPU, memory, RDS</text>
  <text x="515" y="546" text-anchor="middle">Alarms -&gt; SNS email   |   Container logs</text>
  <text x="515" y="574" text-anchor="middle">Local: Prometheus + Grafana (/metrics)</text>

  <g stroke="#334155" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <line x1="120" y1="290" x2="158" y2="290"/>
    <line x1="295" y1="290" x2="348" y2="290"/>
    <line x1="682" y1="285" x2="738" y2="285"/>
    <line x1="718" y1="395" x2="682" y2="395" stroke-dasharray="3 3"/>
    <line x1="718" y1="460" x2="682" y2="415" stroke-dasharray="3 3"/>
  </g>
  <line x1="450" y1="450" x2="450" y2="402" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#r)"/>
  <text x="300" y="436" fill="#b91c1c" font-size="12">alarm -&gt; automatic rollback</text>
  <text x="165" y="385" fill="#475569" font-size="11">prod listener -&gt; BLUE</text>
  <text x="165" y="401" fill="#475569" font-size="11">test listener :8443 -&gt; GREEN</text>
  <path d="M960 140 C 960 165 1000 170 1000 188" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="1015" y="172" fill="#475569" font-size="11">OIDC: no static AWS keys</text>
</svg>
